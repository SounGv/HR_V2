<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GV One · เมนูมือถือ</title>
  <style>
    :root { --bg:#F3F5F7; --card:#fff; --ink:#111827; --muted:#6B7280; --green:#0F7A4B; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"IBM Plex Sans Thai", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    .phone { max-width:390px; margin:0 auto; min-height:100dvh; background:var(--bg); padding-bottom:84px; }
    header { background:var(--green); color:#fff; padding:18px 16px 14px; display:flex; justify-content:space-between; align-items:center; }
    header .brand { font-weight:800; letter-spacing:.2px; }
    header .who { font-size:12px; text-align:right; opacity:.95; }
    h2.sec { font-size:13px; font-weight:800; padding:16px 16px 10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px; }
    .tile { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px; padding:12px 10px; box-shadow:0 1px 2px rgba(15,27,12,.06); min-height:76px; }
    .tile b { display:block; font-size:13.5px; line-height:1.2; }
    .tile small { display:block; margin-top:2px; font-size:11px; color:var(--muted); }
    .quick { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px 18px; }
    nav.tab { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:390px; background:#fff; border-top:1px solid #E5E7EB; display:grid; grid-template-columns:repeat(5,1fr); height:72px; padding-bottom:env(safe-area-inset-bottom); }
    nav.tab a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-decoration:none; color:#374151; font-size:11px; font-weight:700; }
    nav.tab a.on { color:#15803d; }
    nav.tab a.on .ic { background:#bbf7d0; border-radius:999px; padding:2px 8px; }
    .ic { display:flex; }
  </style>
</head>
<body>
<div class="phone">
  <header>
    <div class="brand">GV ONE HR</div>
    <div class="who">แอดมิน ระบบ<br/>ผู้ดูแลระบบ</div>
  </header>
  <h2 class="sec">เมนูด่วน</h2>
  <div class="quick" id="quick"></div>
  <h2 class="sec">เมนู</h2>
  <div class="grid" id="grid"></div>
  <nav class="tab" id="tabs"></nav>
</div>
<script>
const svg = (inner) => `<svg width="40" height="40" viewBox="0 0 48 48" fill="none" aria-hidden>${inner}</svg>`;
const G = {
  check: svg(`<g filter="url(#s)"><rect x="8" y="8" width="32" height="32" rx="10" fill="#16A34A"/><path d="M16.5 24.2 L21.4 29.1 L32.2 18.2" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>`),
  bag: svg(`<path d="M19 15 C19 12.5 21 10.5 24 10.5 C27 10.5 29 12.5 29 15 V17 H32 C34.2 17 35.5 19 35.5 21.5 C35.5 30 31 38.5 24 42 C17 38.5 12.5 30 12.5 21.5 C12.5 19 13.8 17 16 17 H19 V15 Z" fill="#F59E0B"/><path d="M19 17 H29" stroke="#B45309" stroke-width="2" stroke-linecap="round"/><text x="24" y="32" text-anchor="middle" font-size="11" font-weight="800" fill="#78350F">$</text>`),
  alarm: svg(`<path d="M12 14 L6.5 9.5" stroke="#F87171" stroke-width="3" stroke-linecap="round"/><path d="M36 14 L41.5 9.5" stroke="#F87171" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="26" r="14" fill="#F8FAFC" stroke="#EF4444" stroke-width="3.2"/><circle cx="24" cy="26" r="1.6" fill="#0F172A"/><path d="M24 26 L24 18" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round"/><path d="M24 26 L30 29.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>`),
  bars: svg(`<rect x="9" y="26" width="8" height="14" rx="2" fill="#60A5FA"/><rect x="20" y="16" width="8" height="24" rx="2" fill="#34D399"/><rect x="31" y="21" width="8" height="19" rx="2" fill="#FBBF24"/>`),
  people: svg(`<circle cx="30.5" cy="16.5" r="6.2" fill="#60A5FA"/><path d="M21 38.5 C21 31.4 25.2 26.8 30.5 26.8 C35.8 26.8 40 31.4 40 38.5 Z" fill="#60A5FA"/><circle cx="18" cy="16" r="7" fill="#2563EB"/><path d="M6.5 39 C6.5 30.8 11.4 25.4 18 25.4 C24.6 25.4 29.5 30.8 29.5 39 Z" fill="#2563EB"/>`),
  clock: svg(`<circle cx="24" cy="25" r="15" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><circle cx="24" cy="25" r="1.8" fill="#0F172A"/><path d="M24 25 L24 16.5" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round"/><path d="M24 25 L31 28" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>`),
  clip: svg(`<rect x="12" y="10" width="24" height="30" rx="4" fill="#FEF3C7" stroke="#D6B56A"/><rect x="17" y="7" width="14" height="7" rx="2.5" fill="#F59E0B"/><rect x="16" y="20" width="16" height="2.2" rx="1" fill="#D6B56A"/><rect x="16" y="25.5" width="12" height="2.2" rx="1" fill="#D6B56A"/>`),
  bills: svg(`<rect x="9" y="18" width="30" height="18" rx="3" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.4"/><circle cx="24" cy="27" r="5" fill="#FDE68A" stroke="#CA8A04" stroke-width="1.2"/><text x="24" y="30.2" text-anchor="middle" font-size="8" font-weight="800" fill="#A16207">฿</text>`),
  cal: svg(`<rect x="8.5" y="11" width="31" height="28" rx="6" fill="#FFFDF8" stroke="#E7D7C3"/><rect x="8.5" y="11" width="31" height="10" rx="6" fill="#DC2626"/><rect x="8.5" y="17" width="31" height="4" fill="#DC2626"/><rect x="29" y="25.5" width="5" height="5" rx="1" fill="#16A34A"/>`),
  palm: svg(`<ellipse cx="24" cy="41" rx="13" ry="3.2" fill="#E8D5A3"/><path d="M23 40 C21 28 22 18 24.5 12 C26.5 18 27.5 29 25.2 40 Z" fill="#C4A35A"/><path d="M24.5 14 C14 10 9 16 11 20 C16 16 22 16 24.5 16 Z" fill="#22C55E"/><path d="M24.5 14 C35 9 40 15 38 20 C33 16 27 16 24.5 16 Z" fill="#16A34A"/><path d="M24.5 15 C20 6 13 6 12 11 C17 11 22 14 24.5 16 Z" fill="#4ADE80"/>`),
  date: svg(`<rect x="8.5" y="10" width="31" height="29" rx="6" fill="#FFFDF8" stroke="#E7D7C3"/><rect x="8.5" y="10" width="31" height="9" rx="6" fill="#EF4444"/><rect x="8.5" y="15" width="31" height="4" fill="#EF4444"/><text x="24" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#1F2937">17</text>`),
  floppy: svg(`<rect x="10" y="8" width="28" height="32" rx="4" fill="#64748B"/><rect x="14" y="8" width="16" height="12" rx="1.5" fill="#E2E8F0"/><rect x="14" y="24" width="20" height="12" rx="2" fill="#F8FAFC"/>`),
  house: svg(`<path d="M8 22.5 L24 9.5 L40 22.5 V24.5 L24 12 L8 24.5 Z" fill="#E07A2F"/><path d="M11 23.5 H37 V40.5 C37 41.6 36.1 42.5 35 42.5 H13 C11.9 42.5 11 41.6 11 40.5 Z" fill="#F0D9B0"/><rect x="20.5" y="29" width="7" height="13.5" rx="1.2" fill="#8B5A2B"/>`),
  person: svg(`<circle cx="24" cy="16.5" r="8" fill="#1D4ED8"/><path d="M9 40.5 C9 31.2 15.2 25.2 24 25.2 C32.8 25.2 39 31.2 39 40.5 Z" fill="#1D4ED8"/>`),
  heart: svg(`<path d="M24 39 C12 29 8 22 8 16.5 C8 11.5 12 8 16.5 8 C19.8 8 22.3 9.8 24 12.5 C25.7 9.8 28.2 8 31.5 8 C36 8 40 11.5 40 16.5 C40 22 36 29 24 39 Z" fill="#E11D48"/>`),
  apps: svg(`<rect x="8" y="8" width="14" height="14" rx="4" fill="#22C55E"/><rect x="26" y="8" width="14" height="14" rx="4" fill="#3B82F6"/><rect x="8" y="26" width="14" height="14" rx="4" fill="#F59E0B"/><rect x="26" y="26" width="14" height="14" rx="4" fill="#EF4444"/>`),
};
function tile(icon, title, hint) {
  return `<div class="tile">${icon}<span><b>${title}</b><small>${hint}</small></span></div>`;
}
document.getElementById('quick').innerHTML = [
  tile(G.palm,'ขอลา','คำขอลาทั้งหมด'),
  tile(G.alarm,'ขอ OT','ขอและติดตาม'),
  tile(G.cal,'ปฏิทิน','วันหยุด & นัด'),
  tile(G.apps,'เมนูทั้งหมด','บริการทั้งระบบ'),
].join('');
document.getElementById('grid').innerHTML = [
  tile(G.check,'รออนุมัติ','ลา OT และเบิก'),
  tile(G.bag,'ค่าจ้าง','รอบจ่าย & สรุป'),
  tile(G.alarm,'ค้างจ่าย','ครบกำหนด/เลยกำหนด'),
  tile(G.bars,'รายงาน','สรุป & ภาษี'),
  tile(G.people,'พนักงาน','จัดสาร & เรท'),
  tile(G.clock,'บันทึกเวลา','ดูเวลาลงเวลา'),
  tile(G.clip,'วันย','มาสาย/ขาด/ลา'),
  tile(G.bills,'ค่าใช้จ่าย','รายการทั้งหมด'),
  tile(G.bag,'เบิกล่วงหน้า','ทำจ่าย/ตัดยอด'),
  tile(G.cal,'ตารางงาน','แผนงาน & พีค'),
  tile(G.date,'วันหยุด','นักขัตฤกษ์/พิเศษ'),
  tile(G.palm,'การลา','คำขอลาทั้งหมด'),
  tile(G.clip,'ประวัติแก้ไข','ใครทำอะไร'),
  tile(G.floppy,'สำรองข้อมูล','ส่งออก CSV'),
].join('');
const tab = (icon, label, on) => `<a class="${on?'on':''}" href="#"><span class="ic">${icon.replace('width="40" height="40"','width="26" height="26"')}</span>${label}</a>`;
document.getElementById('tabs').innerHTML = [
  tab(G.house,'หน้าหลัก',true),
  tab(G.check,'อนุมัติ',false),
  tab(G.cal,'ตารางงาน',false),
  tab(G.bag,'ค่าจ้าง',false),
  tab(G.people,'พนักงาน',false),
].join('');
</script>
</body>
</html>
